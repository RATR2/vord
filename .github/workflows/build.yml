name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vord
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      # Reads a "version=" tag from the commit message's own line, and requires the "workflow"
      # tag before doing anything at all - opt-in only, same convention as nilum's build.yml.
      # Tags must each be their own line, not just a substring anywhere in the message; otherwise
      # a commit that merely *talks about* "version" or "workflow" in prose (e.g. this very
      # comment) would trigger itself by accident.
      - name: Classify commit
        id: classify
        run: |
          MSG=$(git log -1 --pretty=%B)

          VERSION=""
          if echo "$MSG" | grep -qxE 'version="[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?"'; then
            VERSION=$(echo "$MSG" | grep -oxE 'version="[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?"' | head -1 | cut -d'"' -f2)
          fi

          HAS_WORKFLOW="false"
          if echo "$MSG" | grep -qixE 'workflow'; then
            HAS_WORKFLOW="true"
          fi

          echo "requested_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "has_workflow=$HAS_WORKFLOW" >> "$GITHUB_OUTPUT"

      # Bump, build, and publish all happen in this one job run rather than the bump commit
      # trying to retrigger a second run (which proved fragile: an unchanged version produces an
      # empty commit that build.yml's own paths-ignore filter silently drops, and a shallow
      # single-commit checkout can't push a provable fast-forward to main from a branch other
      # than main). Building straight off this checkout also means the release always reflects
      # exactly the commit that requested it, bump or no bump.
      - name: Bump, build, and publish release
        if: steps.classify.outputs.has_workflow == 'true' && steps.classify.outputs.requested_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VORD_PUSH_TOKEN: ${{ secrets.VORD_PUSH_TOKEN }}
        run: |
          source scripts/ci/lib.sh
          scripts/ci/bump-version.sh "${{ steps.classify.outputs.requested_version }}"
          build_apk
          publish_release "$(read_version)" "$(git rev-parse HEAD)"
